<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:8px 32px 28px;background:#fff;font-family:'Plus Jakarta Sans',sans-serif;">
  <h2 style="font-size:19px;font-weight:800;color:#0F172A;margin:0 0 14px;letter-spacing:-0.01em;">Video Pilihan</h2>
  <div style="display:flex;gap:16px;overflow-x:auto;padding-bottom:6px;">
    <sc-for list="{{ videos }}" as="item" hint-placeholder-count="5">
      <div style="flex:0 0 240px;">
        <div style="position:relative;width:240px;height:140px;border-radius:12px;overflow:hidden;background:#E2E8F0;">

          <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;">
            <div style="width:44px;height:44px;border-radius:999px;background:rgba(15,76,108,0.85);display:flex;align-items:center;justify-content:center;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"></path></svg>
            </div>
          </div>
          <div style="position:absolute;bottom:8px;right:8px;background:rgba(15,23,42,0.75);color:#fff;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;pointer-events:none;">{{ item.duration }}</div>
        </div>
        <div style="font-size:13px;font-weight:700;color:#0F172A;line-height:1.35;margin-top:8px;">{{ item.title }}</div>
      </div>
    </sc-for>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      videos: [
        { title: "Wawancara: Prospek Ekonomi Indonesia 2027", duration: "04:12" },
        { title: "Liputan: Aktivitas Pelabuhan Tanjung Priok Jelang Akhir Tahun", duration: "02:48" },
        { title: "Analisis: Dampak Suku Bunga Acuan bagi Sektor Riil", duration: "06:03" },
        { title: "Sorotan: Perkembangan Proyek Tol Trans Sumatra", duration: "03:27" },
        { title: "Podcast: Diskusi Kebijakan Insentif Pajak UMKM", duration: "12:40" }
      ]
    };
  }
}

</script>
</body>
</html>
