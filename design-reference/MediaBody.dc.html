<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./image-slot.js"></script></helmet>
<div style="padding:8px 32px 28px;background:#F7FAFC;font-family:'Plus Jakarta Sans',sans-serif;">
  <div style="display:grid;grid-template-columns:2fr 1fr;gap:24px;padding-top:24px;">
    <div>
      <h2 style="font-size:19px;font-weight:800;color:#0F172A;margin:0 0 14px;letter-spacing:-0.01em;">Berita Terbaru</h2>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;">
        <sc-for list="{{ gridNews }}" as="item" hint-placeholder-count="6">
          <div style="background:#fff;border:1px solid #E2E8F0;border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,0.04);">
            <image-slot id="grid-{{ $index }}" shape="rect" style="width:100%;height:100px;" placeholder="Thumbnail"></image-slot>
            <div style="padding:10px 12px;">
              <span style="background:{{ item.tagBg }};color:{{ item.tagText }};font-size:9px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;">{{ item.tag }}</span>
              <div style="font-size:13px;font-weight:700;color:#0F172A;line-height:1.32;margin-top:7px;min-height:34px;">{{ item.title }}</div>
              <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:10px;color:#94A3B8;">
                <span>{{ item.time }}</span>
                <span>{{ item.readTime }}</span>
              </div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
    <div>
      <h2 style="font-size:19px;font-weight:800;color:#0F172A;margin:0 0 14px;letter-spacing:-0.01em;">Terpopuler</h2>
      <div style="background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:4px 18px;">
        <sc-for list="{{ popular }}" as="item" hint-placeholder-count="5">
          <div style="display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #EEF1F4;">
            <div style="font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:800;color:#3FA7D6;width:22px;flex-shrink:0;">{{ item.rank }}</div>
            <div>
              <div style="font-size:13px;font-weight:700;color:#0F172A;line-height:1.38;">{{ item.title }}</div>
              <div style="font-size:10px;font-weight:600;color:#0F4C6C;text-transform:uppercase;letter-spacing:0.04em;margin-top:5px;">{{ item.tag }}</div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const grid = [
      { tag: "Nasional", tagBg: "#E8F5FB", tagText: "#0F4C6C", title: "DPR Sahkan Revisi Aturan Perizinan Usaha Kecil", time: "09:20", readTime: "3 menit" },
      { tag: "Bisnis", tagBg: "#F1EAFE", tagText: "#7C3AED", title: "Ekspor Produk Manufaktur Naik 8 Persen Sepanjang Agustus", time: "09:05", readTime: "4 menit" },
      { tag: "Ekonomi", tagBg: "#E7F7EE", tagText: "#16A34A", title: "Bank Sentral Pertahankan Suku Bunga Acuan di Level 5,75 Persen", time: "08:40", readTime: "5 menit" },
      { tag: "Pengumuman", tagBg: "#FEF3E2", tagText: "#D97706", title: "Pendaftaran Program Insentif Pajak UMKM Dibuka Pekan Depan", time: "08:15", readTime: "2 menit" },
      { tag: "Opini", tagBg: "#F1F5F9", tagText: "#64748B", title: "Digitalisasi Rantai Pasok, Peluang atau Beban Baru?", time: "07:50", readTime: "6 menit" },
      { tag: "Nasional", tagBg: "#E8F5FB", tagText: "#0F4C6C", title: "Infrastruktur Logistik Jadi Prioritas Anggaran 2027", time: "07:30", readTime: "4 menit" },
    ];
    const popular = [
      { rank: "01", tag: "Ekonomi", title: "Pertumbuhan Ekonomi Nasional Diproyeksi Capai 5,2 Persen di Kuartal III" },
      { rank: "02", tag: "Bisnis", title: "Startup Logistik Lokal Raih Pendanaan Seri B Rp 320 Miliar" },
      { rank: "03", tag: "Nasional", title: "Pemerintah Percepat Pembangunan Pelabuhan di Tiga Provinsi" },
      { rank: "04", tag: "Opini", title: "Menakar Dampak Suku Bunga Acuan bagi UMKM" },
      { rank: "05", tag: "Pengumuman", title: "Jadwal Layanan Publik Berubah Selama Libur Nasional" }
    ];
    return { gridNews: grid, popular };
  }
}

</script>
</body>
</html>
