<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @keyframes lx-ticker-scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
  </style>
</helmet>
<div style="font-family:'Plus Jakarta Sans',sans-serif;background:#fff;">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 32px;border-bottom:1px solid #E2E8F0;">
    <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
      <div style="width:34px;height:34px;border-radius:9px;background:#0F4C6C;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;">L</div>
      <div style="font-size:18px;font-weight:800;color:#0F172A;letter-spacing:-0.01em;white-space:nowrap;">LOGISTAX<span style="color:#3FA7D6;"> Media</span></div>
    </div>
    <nav style="display:flex;gap:26px;">
      <sc-for list="{{ categories }}" as="cat" hint-placeholder-count="5">
        <a href="#" style="font-size:14px;font-weight:600;color:{{ cat.active }};text-decoration:none;">{{ cat.name }}</a>
      </sc-for>
    </nav>
    <div style="display:flex;align-items:center;gap:16px;flex-shrink:0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <div style="background:#0F4C6C;color:#fff;font-size:13px;font-weight:700;padding:8px 16px;border-radius:8px;white-space:nowrap;">Berlangganan</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;background:#0F4C6C;height:34px;overflow:hidden;">
    <div style="flex-shrink:0;display:flex;align-items:center;gap:6px;background:#3FA7D6;color:#0F4C6C;font-size:11px;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;padding:0 14px;height:100%;">
      <span style="width:6px;height:6px;border-radius:999px;background:#0F4C6C;"></span>Breaking News
    </div>
    <div style="flex:1;overflow:hidden;position:relative;height:100%;display:flex;align-items:center;">
      <div style="white-space:nowrap;color:#fff;font-size:13px;font-weight:500;padding-left:100%;animation:lx-ticker-scroll 22s linear infinite;">{{ tickerText }}</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;padding:9px 32px;border-bottom:1px solid #E2E8F0;background:#F7FAFC;">
    <span style="font-size:12px;font-weight:700;color:#64748B;flex-shrink:0;">Trending:</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <sc-for list="{{ trending }}" as="topic" hint-placeholder-count="6">
        <a href="#" style="font-size:12px;font-weight:600;color:#0F4C6C;background:#E8F5FB;padding:5px 12px;border-radius:999px;text-decoration:none;white-space:nowrap;">{{ topic }}</a>
      </sc-for>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const names = ["Nasional", "Ekonomi", "Bisnis", "Pengumuman", "Opini"];
    return {
      categories: names.map((name, i) => ({ name, active: i === 0 ? "#0F4C6C" : "#334155" })),
      tickerText: "Bank Sentral pertahankan suku bunga acuan di 5,75 persen  •  Ekspor manufaktur naik 8 persen sepanjang Agustus  •  Pemerintah percepat pembangunan pelabuhan di tiga provinsi  •  Pendaftaran insentif pajak UMKM dibuka pekan depan",
      trending: ["Pemilu 2026", "Harga BBM", "Timnas Indonesia", "Suku Bunga BI", "Ekspor Manufaktur", "Insentif UMKM"]
    };
  }
}

</script>
</body>
</html>
